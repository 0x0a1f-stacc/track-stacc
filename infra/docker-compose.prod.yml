services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackstacc}
      POSTGRES_USER: ${POSTGRES_USER:-trackstacc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      HOST_SECRET_SALT: ${HOST_SECRET_SALT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      NODE_ENV: production
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "80:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
